---
name: update-known-shas

on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 6 * * 1

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve new action SHAs
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/update-known-shas.sh

          PROPS_FILE="src/main/resources/META-INF/rewrite/known-action-shas.properties"
          if git diff --quiet "$PROPS_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            ADDED=""
            UPDATED=""
            while IFS= read -r line; do
              if [[ "$line" == +* && "$line" != +++* && "$line" == *=* ]]; then
                new_key="${line:1}"
                new_key="${new_key%%=*}"
                new_sha="${line#*=}"
                # Check if this key also appears in removed lines (i.e. updated)
                if git diff "$PROPS_FILE" | grep -qF -- "-${new_key}="; then
                  UPDATED+="- \`${new_key}\` → \`${new_sha}\`"$'\n'
                else
                  ADDED+="- \`${new_key}\` → \`${new_sha}\`"$'\n'
                fi
              fi
            done < <(git diff "$PROPS_FILE")

            BODY=""
            if [[ -n "$UPDATED" ]]; then
              BODY+="### Updated (drifted tags)"$'\n\n'"${UPDATED}"$'\n'
            fi
            if [[ -n "$ADDED" ]]; then
              BODY+="### Added"$'\n\n'"${ADDED}"$'\n'
            fi

            echo "$BODY" >> "$GITHUB_STEP_SUMMARY"

            {
              echo "commit_body<<EOF_COMMIT_BODY"
              echo "$BODY"
              echo "EOF_COMMIT_BODY"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit to main
        if: steps.update.outputs.changed == 'true'
        env:
          COMMIT_BODY: ${{ steps.update.outputs.commit_body }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/META-INF/rewrite/known-action-shas.properties
          git commit -m "Update known action SHAs" -m "$COMMIT_BODY"
          git push origin HEAD:main
